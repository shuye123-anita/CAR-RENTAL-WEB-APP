<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Car Rental Cloud Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="dash-header">
            <div class="logo">
                <i class="fas fa-car-side"></i>
                <h1>Car Rental Cloud Storage</h1>
            </div>
            <div class="user-info">
                <span>Welcome back, <strong>{{ username }}</strong>!</span>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </header>

        <main class="dash-main">
            <div class="storage-card">
                <h3>Storage Overview</h3>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="usage-bar"></div>
                    </div>
                    <p>Used: <span id="used-space">0 B</span> of 1.25 GB (<span id="used-percent">0</span>%)</p>
                </div>
            </div>

            <div class="upload-area" id="drop-zone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h2>Drop files here to upload</h2>
                <p>or</p>
                <button onclick="document.getElementById('file-input').click()" class="upload-btn">
                    Choose Files
                </button>
                <input type="file" id="file-input" multiple style="display:none">
                <small>Max 100MB • Files encrypted & distributed</small>
            </div>

            <div class="files-section">
                <h3>Your Files</h3>
                <div id="files-table"></div>
            </div>
        </main>

        <footer>
            © 2025 Car Rental Cloud Storage System • All files encrypted & distributed
        </footer>
    </div>

    <script>
        // Simple JavaScript for the dashboard
        document.getElementById('usage-bar').style.width = '25%';
        document.getElementById('used-space').textContent = '320 MB';
        document.getElementById('used-percent').textContent = '25';
        
        // File upload simulation
        document.getElementById('drop-zone').addEventListener('click', function() {
            alert('File upload functionality will be implemented in the next phase!');
        });
        
        // Display sample files
        document.getElementById('files-table').innerHTML = `
            <div style="text-align:center; padding:60px; color:#95a5a6;">
                <i class="fas fa-cloud-upload-alt fa-4x"></i><br><br>
                <h3>No files yet</h3>
                <p>Upload your first file to get started</p>
                <p><small>File storage functionality coming soon!</small></p>
            </div>
        `;
    </script>
</body>
</html>
